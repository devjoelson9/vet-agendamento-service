services:
  agendamento-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-vet_agendamento}
      POSTGRES_USER: ${DB_USER:-vet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vet}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - agendamento-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vet} -d ${DB_NAME:-vet_agendamento}"]
      interval: 5s
      timeout: 5s
      retries: 10

  agendamento-service:
    build: .
    depends_on:
      agendamento-db:
        condition: service_healthy
    environment:
      DB_HOST: agendamento-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-vet_agendamento}
      DB_USER: ${DB_USER:-vet}
      DB_PASSWORD: ${DB_PASSWORD:-vet}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
    ports:
      - "${APP_PORT:-8084}:8080"

volumes:
  agendamento-db-data:
