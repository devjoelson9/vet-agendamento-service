spring.application.name=vet-agendamento-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:vet_agendamento}
spring.datasource.username=${DB_USER:vet}
spring.datasource.password=${DB_PASSWORD:vet}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}

identidade.base-url=${IDENTIDADE_BASE_URL:http://localhost:8080}

management.endpoints.web.exposure.include=health
